services:
  recipify:
    build: .
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "recipify.wsgi:application"]
    restart: always
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - PRODUCTION=True
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - recipify
    networks:
      default:
        # Preserve the existing FRP destination without exposing host port 80.
        aliases:
          - daffodil-6-nginx-1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  static_volume:
  media_volume:
  caddy_data:
  caddy_config:
