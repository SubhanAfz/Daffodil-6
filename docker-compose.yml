services:
  recipify:
    build: .
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "recipify.wsgi:application"]
    restart: always
    volumes:
      - static_volume:/app/static
    environment:
      - DEBUG=False
  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - recipify
    restart: always

volumes:
  static_volume: