{% extends 'base_content.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="text-center mb-5">
                <h1 class="display-4 fw-bold mb-3">{{ recipe.title }}</h1>
                <div class="text-muted">
                    <span class="me-3">By <strong>{{ recipe.author }}</strong></span>
                    <span>{{ recipe.views }} views</span>
                </div>
            </div>

            <div class="mb-5">
                <p class="lead text-center fst-italic text-muted mb-4">"{{ recipe.description }}"</p>
                <div class="py-4 border-top border-bottom">
                    <p class="mb-0" style="white-space: pre-wrap;">{{ recipe.content }}</p>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-2 mb-5">
                <button class="btn btn-outline-dark rounded-pill px-4">
                    Like
                </button>
                <button class="btn btn-dark rounded-pill px-4">
                    Favourite
                </button>
                <button class="btn btn-link text-muted text-decoration-none px-4">
                    Report
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
