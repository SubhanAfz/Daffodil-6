<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    {% if recipes|length == 0 %}
        <div class="col">
            <p class="text-center text-muted" id="no-recipes-text">No recipes found.</p>
        </div>
    {% endif %}
    {% for item in recipes %}
        <div class="col">
            <div class="card border-0 shadow-sm">
                {% if item.thumbnail %}
                    <img
                        src="{{ item.thumbnail.url }}"
                        class="card-img-top"
                        alt="{{ item.title }}"
                        style="height: 200px; object-fit: cover; width: 100%"
                    />
                {% else %}
                    <div
                        style="height: 200px; width: 100%; background-color: #555"
                    ></div>
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title fw-bold">{{ item.title }}</h5>
                    <p class="card-text text-muted mb-2">
                        {{ item.author.username }}
                    </p>
                    <div class="d-flex gap-3 text-muted small">
                        <span>
                            <span class="bi-heart-fill text-secondary"></span> {{ item.liked_by.count }}
                        </span>
                        <span>
                            <span class="bi-star-fill text-secondary"></span> {{ item.favourited_by.count }}
                        </span>
                    </div>
                    <a
                        href="{% url 'recipe_detail' item.id %}"
                        class="stretched-link"
                    ></a>
                </div>
            </div>
        </div>
    {% endfor %}

</div>
