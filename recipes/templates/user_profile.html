{% extends 'base_content.html' %}
{% block content %}
<div class="container mt-5">  
    <div class="row mb-4">    
        <div class="col-12">      
            <h1 class="display-4 fw-bold">{{ profile_user.full_name }}</h1>      
            <p class="text-muted">{{ profile_user.username }}</p>    
        </div>  
    </div>  
    <hr class="mb-5" />  
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">    {% for recipe in recipes %}    
        <div class="col">      
            <div class="card border-0 shadow-sm">        
                <div style="height:200px; width:100%; background-color:#555"></div>        
                <div class="card-body">          
                    <h5 class="card-title fw-bold">{{ recipe.title }}</h5>          
                    <p class="card-text text-muted">{{ recipe.description }}</p>          
                    <a href="{% url 'recipe_detail' recipe.id %}" class="btn btn-sm btn-dark">View</a>        
                </div>      
            </div>    
        </div>    
        {% empty %}    
        <div class="col-12 text-center">      
            <p class="text-muted">This user hasn't posted any recipes yet.</p>    
        </div>    
        {% endfor %}  
    </div>
</div>{% endblock %}
