{% extends 'base_content.html' %} {% block content %}
<div class="container mt-5">
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h1 class="display-4 fw-bold">{{ user.username }}</h1>
        </div>
        <div class="col-md-6 text-md-end text-center">
            <div class="d-inline-block me-4">
                <span class="d-block fw-bold h4 mb-0">589</span>
                <small class="text-muted">Followers</small>
            </div>
            <div class="d-inline-block">
                <span class="d-block fw-bold h4 mb-0">589</span>
                <small class="text-muted">Following</small>
            </div>
        </div>
    </div>

    <div class="row mb-5">
        <div class="col-12">
            <div class="d-flex gap-3">
                <a href="{% url 'profile' %}" class="btn btn-outline-dark px-4"
                    >Edit Profile</a
                >
                <a
                    href="{% url 'like_list' %}"
                    class="btn btn-outline-dark px-4"
                    >My Likes</a
                >
                <a
                    href="{% url 'favourite_list' %}"
                    class="btn btn-outline-dark px-4"
                    >My Favourites</a
                >
            </div>
        </div>
    </div>

    <hr class="mb-5" />

    <div class="row mb-4">
        <div class="col-12 text-center">
            <h2 class="fw-bold">Your Delicious Recipes</h2>
        </div>
    </div>
    {% include "partials/recipe_feed.html" with recipes=recipes %}
</div>
{% endblock %}
