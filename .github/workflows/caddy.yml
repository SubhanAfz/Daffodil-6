name: Validate Caddy deployment

on:
  pull_request:
    paths:
      - 'caddy/**'
      - 'docker-compose.yml'
      - '.github/workflows/caddy.yml'
  push:
    branches: [main]
    paths:
      - 'caddy/**'
      - 'docker-compose.yml'
      - '.github/workflows/caddy.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate Caddy configuration
        run: docker compose -f docker-compose.yml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
