name: Lint using Ruff

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:


jobs:
    lint:
        name: Run Ruff linter
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Ruff
              uses: astral-sh/ruff-action@v3

